<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>FAQ — Ignite School MUN 2026</title>
<meta name="description" content="Answers on registration, fees, what happens during the conference, and how to prepare.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap">
<script src="reveal.js"></script>
<style>
  body { margin:0; background:#fff; color:#16181C; font-family:Inter,system-ui,sans-serif; overflow-x:hidden; }
  * { box-sizing:border-box; }
  a { color:#C08F00; } a:hover { color:#16181C; }
  :focus-visible { outline:2px solid #C08F00; outline-offset:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</helmet>
<dc-import name="Nav" active="more" hint-size="100%,80px"></dc-import>
<main>
  <dc-import name="PageHeader" eyebrow="HOME / FAQ" title="Frequently asked questions" blurb="If your question is not here, email us — we would rather answer it twice than have you guess." hint-size="100%,220px"></dc-import>

  <section style="background:#fff;padding:clamp(48px,7vw,88px) 0 clamp(56px,9vw,120px)">
    <div style="width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(24px,5vw,64px);display:flex;justify-content:center">
      <div style="width:100%;max-width:760px;display:flex;flex-direction:column;gap:clamp(40px,6vw,72px)">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
          <div data-reveal style="display:flex;flex-direction:column;gap:16px;align-items:flex-start">
            <span aria-hidden="true" style="display:block;width:48px;height:3px;background:#E8B10A"></span>
            <span style="font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#C08F00">{{ g.label }}</span>
            <ul style="margin:8px 0 0;padding:0;list-style:none;width:100%;border-top:1px solid #DCDFE4">
              <sc-for list="{{ g.items }}" as="q" hint-placeholder-count="5">
                <li style="border-bottom:1px solid #DCDFE4">
                  <button type="button" onClick="{{ q.onClick }}" aria-expanded="{{ q.open }}" style="width:100%;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;text-align:left;background:none;border:none;padding:20px 4px;min-height:44px;cursor:pointer;font-family:Inter,sans-serif">
                    <span style="font-family:'Source Serif 4',Georgia,serif;font-size:clamp(18px,2vw,21px);font-weight:600;line-height:1.4;color:{{ q.fg }}">{{ q.q }}</span>
                    <span aria-hidden="true" style="font-size:24px;color:#5B636E;line-height:1">{{ q.sign }}</span>
                  </button>
                  <sc-if value="{{ q.open }}" hint-placeholder-val="{{ true }}">
                    <p style="margin:0;padding:0 4px 22px;font-size:17px;line-height:1.7;color:#5B636E;max-width:64ch;text-wrap:pretty">{{ q.a }}</p>
                  </sc-if>
                </li>
              </sc-for>
            </ul>
          </div>
        </sc-for>
      </div>
    </div>
  </section>

  <section style="background:#F4F5F7;padding:clamp(48px,7vw,88px) 0">
    <div data-reveal style="width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(24px,5vw,64px);display:flex;flex-wrap:wrap;gap:20px 48px;align-items:center;justify-content:space-between">
      <div style="display:flex;flex-direction:column;gap:8px;max-width:48ch">
        <h2 style="margin:0;font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:clamp(24px,2.8vw,32px);line-height:1.25">Still stuck?</h2>
        <p style="margin:0;font-size:17px;line-height:1.6;color:#5B636E">Email the team directly. We usually reply within [N] working days.</p>
      </div>
      <a href="Contact.dc.html" style="color:#16181C;font-size:16px;font-weight:600;text-decoration:none;padding:14px 28px;border:1.5px solid #16181C;border-radius:4px;transition:background 180ms ease,color 180ms ease" style-hover="background:#16181C;color:#fff">Contact us</a>
    </div>
  </section>
</main>
<dc-import name="Footer" hint-size="100%,460px"></dc-import>
</x-dc>
<script type="text/x-dc" data-dc-script>
const GROUPS = [
  { label: 'Registration & fees', items: [
    { q: 'Who can register?', a: 'Secondary school students, from any school. You do not need to have done Model UN before, and you do not need your school to be sending a delegation. Registration is handled entirely through the sign-up form, and we confirm every place by email before asking for payment.' },
    { q: 'Can I come on my own, without a school delegation?', a: 'Yes. Individual delegates are welcome and are placed into committees alongside everyone else — you will not be seated in a corner reserved for people without a delegation. In practice a good number of delegates at a first conference arrive on their own, so you will be in company.' },
    { q: 'What does the fee cover?', a: 'The delegate fee covers both days of committee sessions, lunch and refreshments on each day, your delegate pack with placard and name badge, the background guides for both of your committee topics, and a certificate of participation. There are no further costs once you have paid.' },
    { q: 'What if I cannot afford the fee?', a: 'Write to the registration address before the deadline and ask. Bursaries are available and the conversation is handled privately by two people — nobody in your committee will know. We would much rather cover a fee quietly than lose a delegate who wanted to come.' },
    { q: 'Can I get a refund if I drop out?', a: 'Yes, in full, up to the registration deadline. After that we have already committed to catering and printing on the basis of your place, so refunds are handled case by case. If something serious comes up, tell us — we are reasonable about genuine emergencies.' },
  ]},
  { label: 'During the conference', items: [
    { q: 'What should I bring on the first day?', a: 'Your position paper, a pen and something to write on, a printed or downloaded copy of your background guide, and a water bottle. Laptops and tablets are useful for drafting but are not required. Everything else — placard, badge, delegate pack — is waiting for you at the registration desk.' },
    { q: 'Is food provided?', a: 'Yes. Lunch and refreshments are provided on both days and are included in the delegate fee. Tell us about allergies and dietary requirements on the sign-up form, and we will make sure there is something for you rather than improvising on the day.' },
    { q: 'Can I use my laptop or phone in committee?', a: 'Laptops and tablets are allowed during unmoderated caucus and for drafting, since that is genuinely how resolutions get written. Phones stay away during formal debate. If you need a device for an accessibility reason, note it on the sign-up form and the dais will be told in advance.' },
    { q: 'Are there awards?', a: 'Yes. Each committee awards Best Delegate, Outstanding Delegate and Honourable Mentions, and there is an award for the strongest position paper. Chairs judge on the quality of your argument, your diplomacy and how much you actually moved the room — not on how often you spoke.' },
  ]},
  { label: 'Preparation', items: [
    { q: 'I have never done MUN before. Will I be lost?', a: 'Almost certainly not, and definitely not for long. A good share of the delegates at a first conference are also doing their first conference, and the chairs know that. Read the beginner guide on the Resources page, arrive with a position paper, and ask the dais when you are unsure — that is exactly what they are there for.' },
    { q: 'How do I pick committee preferences?', a: 'Pick for the topic rather than the prestige. A committee whose subject you genuinely find interesting will carry you through two full days far better than a famous one you picked because it sounded impressive. If you are new, the larger General Assembly committees are more forgiving than the Security Council or a crisis room.' },
    { q: 'Is a position paper compulsory?', a: 'Yes. A position paper is required for every delegate and is what the dais reads before the conference to know where you stand. It is also the only way to be considered for the position paper award. The template and a worked example are on the Resources page.' },
    { q: 'How much research is enough?', a: 'Enough to defend your position when someone challenges it. In practice that means your country\'s actual statements on both topics, how it has voted before, and a rough sense of which delegations you will need on side. If you can answer why does your country think that three times over, you have done enough.' },
  ]},
];

class Component extends DCLogic {
  state = { open: '0-0' };
  componentDidMount() { setTimeout(() => window.MUNReveal && window.MUNReveal(), 150); }
  renderVals() {
    return {
      groups: GROUPS.map((g, gi) => ({
        label: g.label,
        items: g.items.map((it, ii) => {
          const key = gi + '-' + ii;
          const open = this.state.open === key;
          return {
            q: it.q, a: it.a, open,
            sign: open ? '−' : '+',
            fg: open ? '#C08F00' : '#16181C',
            onClick: () => this.setState(s => ({ open: s.open === key ? '' : key })),
          };
        }),
      })),
    };
  }
}
</script>
</body>
</html>
