<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&display=swap">
</helmet>
<header style="position:sticky;top:0;z-index:60;background:#FFFFFF;border-bottom:1px solid #DCDFE4;box-shadow:0 8px 24px rgba(22,24,28,.10);font-family:Inter,system-ui,sans-serif">
  <div style="width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(24px,5vw,64px);height:clamp(64px,7vw,80px);display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#16181C;flex:0 0 auto">
      <span style="width:26px;height:26px;border:1.5px solid #16181C;border-radius:50%;display:block;position:relative">
        <span style="position:absolute;inset:6px;border:1.5px solid #E8B10A;border-radius:50%;display:block"></span>
      </span>
      <span style="font-family:'Source Serif 4',Georgia,serif;font-weight:700;font-size:17px;letter-spacing:-.01em">ISMUN</span>
    </a>
    <nav style="display:flex;align-items:center;gap:clamp(14px,2.2vw,30px);flex-wrap:wrap;justify-content:flex-end">
      <a href="About.dc.html" style="font-size:15px;font-weight:500;color:#16181C;text-decoration:none;padding:6px 0;border-bottom:3px solid {{ cAbout }}" style-hover="color:#C08F00">About</a>
      <a href="Committees.dc.html" style="font-size:15px;font-weight:500;color:#16181C;text-decoration:none;padding:6px 0;border-bottom:3px solid {{ cCommittees }}" style-hover="color:#C08F00">Committees</a>
      <a href="Schedule.dc.html" style="font-size:15px;font-weight:500;color:#16181C;text-decoration:none;padding:6px 0;border-bottom:3px solid {{ cSchedule }}" style-hover="color:#C08F00">Schedule</a>
      <a href="Team.dc.html" style="font-size:15px;font-weight:500;color:#16181C;text-decoration:none;padding:6px 0;border-bottom:3px solid {{ cTeam }}" style-hover="color:#C08F00">Team</a>
      <span style="position:relative">
        <button type="button" onClick="{{ toggleMore }}" style="font-family:Inter,sans-serif;font-size:15px;font-weight:500;color:#16181C;background:none;border:none;padding:6px 0;cursor:pointer;display:flex;align-items:center;gap:5px;border-bottom:3px solid {{ cMore }}" style-hover="color:#C08F00">More
          <svg width="10" height="7" viewBox="0 0 10 7" fill="none" aria-hidden="true"><path d="M1 1.5 5 5.5 9 1.5" stroke="#5B636E" stroke-width="1.5" stroke-linecap="round"></path></svg>
        </button>
        <sc-if value="{{ moreOpen }}" hint-placeholder-val="{{ false }}">
          <span style="position:absolute;top:100%;right:0;margin-top:10px;background:#fff;border:1px solid #DCDFE4;border-radius:4px;box-shadow:0 8px 24px rgba(22,24,28,.10);min-width:170px;display:flex;flex-direction:column;padding:6px">
            <a href="Resources.dc.html" style="padding:8px 10px;font-size:15px;color:#16181C;text-decoration:none;border-radius:2px" style-hover="background:#F4F5F7">Resources</a>
            <a href="FAQ.dc.html" style="padding:8px 10px;font-size:15px;color:#16181C;text-decoration:none;border-radius:2px" style-hover="background:#F4F5F7">FAQ</a>
            <a href="Contact.dc.html" style="padding:8px 10px;font-size:15px;color:#16181C;text-decoration:none;border-radius:2px" style-hover="background:#F4F5F7">Contact</a>
          </span>
        </sc-if>
      </span>
      <a href="Register.dc.html" aria-label="Sign up as a delegate" style="background:#E8B10A;color:#16181C;font-size:15px;font-weight:600;text-decoration:none;padding:12px 24px;border-radius:4px;transition:background 180ms ease,transform 180ms ease" style-hover="background:#C08F00;transform:translateY(-1px)">Sign Up</a>
    </nav>
  </div>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:100},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;about&quot;,&quot;committees&quot;,&quot;schedule&quot;,&quot;team&quot;,&quot;more&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { moreOpen: false };
  renderVals() {
    const a = this.props.active;
    const on = (k) => (a === k ? '#E8B10A' : 'transparent');
    return {
      cAbout: on('about'), cCommittees: on('committees'), cSchedule: on('schedule'),
      cTeam: on('team'), cMore: on('more'),
      moreOpen: this.state.moreOpen,
      toggleMore: () => this.setState(s => ({ moreOpen: !s.moreOpen })),
    };
  }
}
</script>
</body>
</html>
